[package]
name = "gitmeta"
version = "0.1.2"
edition = "2021"
description = "Núcleo de issues e PRs locais para Git: log de eventos imutáveis"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
git2 = { version = "0.18", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
